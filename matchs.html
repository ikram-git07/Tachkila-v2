<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./style.css">
    <script src="matchs.js" defer></script>

</head>

<body class="bg-slate-900">
    <header class="bg-slate-800 p-3 border-b-4 border-slate-500 text-white flex flex-wrap justify-between gap-3">

        <div class="flex  items-center  gap-3">
            <img src="Microsoft-Fluentui-Emoji-3d-Soccer-Ball-3d.svg" alt="">
            <strong>
                <h1>TACHKILA</h1>
            </strong>

        </div>
        <div class="rounded-2xl border border-slate-700 p-3">
            <nav class="flex items-center gap-5">
                <a href="index.html" class="font-semibold  hover:text-green-400 ">Effectif</a>
                <a href="matchs.html" class="font-semibold text-green-400">Matchs</a>
                <a href="composition.html" class="font-semibold hover:text-green-400">Composition</a>
            </nav>
        </div>
        <nav>
            <ul class="flex items-center gap-6 p-3">
                <li class="flex items-center gap-2 text-base font-bold  text-amber-500 ">
                    <span class="w-3 h-3 rounded-full bg-amber-500"> </span>GB
                </li>
                <li class="flex items-center gap-2 text-base font-bold  text-blue-500 ">
                    <span class="w-3 h-3 rounded-full bg-blue-500"> </span>DEF
                </li>
                <li class="flex items-center gap-2 text-base font-bold  text-green-500 ">
                    <span class="w-3 h-3 rounded-full bg-green-500"> </span>MIL
                </li>
                <li class="flex items-center gap-2 text-base font-bold  text-red-500 ">
                    <span class="w-3 h-3 rounded-full bg-red-500"> </span>ATT
                </li>
            </ul>
        </nav>

    </header>
    <main class="p-6">
        <div class="flex items-center justify-between text-white">
            <div>
                <h2 class="text-3xl font-bold"> Matchs</h2>
                <p class="text-slate-400 text-sm ">Calendrier et resultats de la saison 2026/2027.</p>

            </div>
            <div class="flex items-center gap-4">
                <button id="clik"
                    class="  text-white bg-green-400  text-white font-bold rounded-md cursor-pointer  px-4  py-2">
                    <strong> +Ajouter un match </strong>
                </button>





                <div id="mymdl" class=" fixed inset-0  hidden items-center justify-center bg-black/60 p-4">
                    <div class="w-full max-w-xl bg-slate-900 rounded-2xl  border border-slate-700  p-6 text-white">
                        <div class="flex justify-between items-center font-bold mb-4">
                            <strong id="titre-modal">Ajouter un match</strong>
                            <button id="fermer"
                                class="text-2xl leading-none text-slate-400 hover:text-white cursor-pointer">
                                &times;</button>
                        </div>
                        <div class="flex flex-col gap-4">
                            <div>
                                <label for="adversaire" class="text-xs font-semibold text-slate-300">Adversaire</label>
                                <input type="text" id="adversaire"
                                    class="w-full mt-1 bg-slate-900 border border-slate-700 p-2 rounded-lg text-white focus:outline-none focus:border-green-500">

                            </div>
                            <div class="flex gap-3">
                                <div class="flex-1">
                                    <label for="date" class="text-xs font-semibold text-slate-300">Date</label>
                                    <input type="date" id="date"
                                        class="w-full mt-1 bg-slate-900 border border-slate-700 p-2 rounded-lg text-white">

                                </div>


                                <div class="flex-1">
                                    <label for="heure" class="text-xs font-semibold text-slate-300">Heure</label>
                                    <input type="time" id="heure"
                                        class="w-full mt-1 bg-slate-900 border border-slate-700 p-2 rounded-lg text-white">

                                </div>


                            </div>
                            <div>
                                <label for="lieu" class="text-xs font-semibold text-slate-300">Lieu</label>
                                <input type="text" id="lieu"
                                    class="w-full mt-1 bg-slate-900 border border-slate-700 p-2 rounded-lg text-white focus:outline-none focus:border-green-500 ">

                            </div>
                            <div>
                                <p class="text-xs font-semibold text-slate-300 "> Lieu du match</p>
                                <div class="flex gap-3 mt-1">

                                    <label
                                        class="flex-1 flex items-center gap-2 bg-slate-900 border border-slate-700 p-2 rounded-lg cursor-pointer">
                                        <input type="radio" name="type" value="Domicile" checked>Domicile
                                    </label>
                                    <label
                                        class="flex-1 flex items-center gap-2 bg-slate-900 border border-slate-700 p-2 rounded-lg cursor-pointer ">
                                        <input type="radio" name="type" value="Extérieur">Extérieur</label>

                                </div>
                            </div>
                            <p id="msg" class="text-red-500 text-sm"></p>


                        </div>
                        <div class="flex justify-end gap-3 mt-6 ">
                            <button id="annuler"
                                class="px-4 py-2 rounded-lg bg-slate-700 text-white text-sm font-semibold cursor-pointer">Annuler</button>
                            <button id="enregistrer"
                                class="px-4 py-2 rounded-lg bg-green-500 text-white text-sm font-semibold cursor-pointer">Enregistrer</button>

                        </div>

                    </div>
                </div>
            </div>
        </div>

        <div id="mdl-score" class="fixed inset-0 hidden items-center justify-center bg-black/60 p-4">
            <div class="w-full max-w-sm bg-slate-800 rounded-2xl border border-slate-700 p-6 text-white">

                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-lg font-bold">Saisir le score</h2>
                    <button id="fermer-score"
                        class="text-2xl leading-none text-slate-400 hover:text-white cursor-pointer">&times;</button>
                </div>

                <p id="titre-score" class="text-slate-400 text-sm mb-4"></p>

                <div class="flex items-center gap-3">
                    <div class="flex-1">
                        <label for="buts-nous" class="text-xs font-semibold text-slate-300">Atlas FC</label>
                        <input type="number" min="0" id="buts-nous"
                            class="w-full mt-1 bg-slate-900 border border-slate-700 p-2 rounded-lg text-white text-center text-xl focus:outline-none focus:border-green-500">
                    </div>
                    <span class="mt-5 text-xl font-bold">-</span>
                    <div class="flex-1">
                        <label for="buts-eux" class="text-xs font-semibold text-slate-300">Adversaire</label>
                        <input type="number" min="0" id="buts-eux"
                            class="w-full mt-1 bg-slate-900 border border-slate-700 p-2 rounded-lg text-white text-center text-xl focus:outline-none focus:border-green-500">
                    </div>
                </div>

                <p id="msg-score" class="text-red-500 text-sm mt-3"></p>

                <div class="flex justify-end gap-3 mt-6">
                    <button id="annuler-score"
                        class="px-4 py-2 rounded-lg bg-slate-700 text-white text-sm font-semibold cursor-pointer">Annuler</button>
                    <button id="enregistrer-score"
                        class="px-4 py-2 rounded-lg bg-green-500 text-white text-sm font-semibold cursor-pointer">Enregistrer</button>
                </div>

            </div>
        </div>



        <div class="flex  gap-1 rounded-lg bg-slate-900 p-1 w-full ">

            <div class=" flex  items-center gap-3 rounded-xl border border-slate-700 bg-slate-800 p-4 w-full">
                <div class="grid grid-cols-3 w-100 bg-slate-900 rounded-xl p-1 ">
                    <button data-filter="tous"
                        class="filter rounded-md bg-green-500 px-2 py-1 text-sm font-semibold text-white">Tous
                        <span id="nb-tous" class="ml-1 text-xs bg-black/30 px-1.5 py-0.5 rounded">0</span>
                    </button>
                    <button data-filter="avenir" class="filter rounded-md px-3 py-1 text-sm font-semibold text-white">À
                        venir
                        <span id="nb-avenir" class="ml-1 text-xs bg-black/30 px-1.5 py-0.5 rounded">0</span>
                    </button>
                    <button data-filter="joues" class="filter rounded-md px-3 py-1 text-sm font-semibold  text-white">
                        Joués
                        <span id="nb-joues" class="ml-1 text-xs bg-black/30 px-1.5 py-0.5 rounded">0</span>
                    </button>
                </div>
                <input id="recherche" type="search" placeholder="rechercher un advensaire... "
                    class="w-full bg-slate-900 p-1 rounded-xl text-white">
            </div>
        </div>
        <div id="liste" class="mt-4 flex flex-col gap-4"></div>


    </main>
</body>

</html>
