<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./style.css">
    <script src="tachkila.js" defer></script>
</head>

<body class="bg-slate-900">
    <header class="bg-slate-800 p-3 border-b-4 border-slate-500 text-white flex flex-wrap justify-between gap-3">

        <div class="flex  items-center  gap-3">
            <img src="Microsoft-Fluentui-Emoji-3d-Soccer-Ball-3d.svg" alt="">
            <strong>
                <h1>TACHKILA</h1>
            </strong>

        </div>
        <div class="rounded-2xl border border-slate-700 p-3">
            <nav class="flex items-center gap-5">
                <a href="effectif.html" class="font-semibold  hover:text-green-400 ">Effectif</a>
                <a href="matchs.html" class="font-semibold text-green-400">Matchs</a>
                <a href="composition.html" class="font-semibold hover:text-green-400">Composition</a>
            </nav>
        </div>
        <nav>
            <ul class="flex items-center gap-6 p-3">
                <li class="flex items-center gap-2 text-base font-bold  text-amber-500 ">
                    <span class="w-3 h-3 rounded-full bg-amber-500"> </span>GB
                </li>
                <li class="flex items-center gap-2 text-base font-bold  text-blue-500 ">
                    <span class="w-3 h-3 rounded-full bg-blue-500"> </span>DEF
                </li>
                <li class="flex items-center gap-2 text-base font-bold  text-green-500 ">
                    <span class="w-3 h-3 rounded-full bg-green-500"> </span>MIL
                </li>
                <li class="flex items-center gap-2 text-base font-bold  text-red-500 ">
                    <span class="w-3 h-3 rounded-full bg-red-500"> </span>ATT
                </li>
            </ul>
        </nav>

    </header>
    <main class="p-6">
        <div class="flex items-center justify-between text-white">
            <div>
                <h2 class="text-3xl font-bold"> Matchs</h2>
                <p class="text-slate-400 text-sm ">Calendrier et resultats de la saison 2026/2027.</p>

            </div>
            <div class="flex items-center gap-4">
                <button id="clik"
                    class="  text-white bg-green-400  text-white font-bold rounded-md cursor-pointer  px-4  py-2">
                    <strong> +Ajouter un match </strong>
                </button>



                <div id="mdl_modif" class="fixed inset-0 hidden items-center justify-center bg-black/60 p-4">
                    <div class="w-full max-w-md bg-slate-800 rounded-2xl border border-slate-700 p-6 text-white">

                    </div>
                </div>


                <div id="mymdl" class=" fixed inset-0  hidden items-center justify-center bg-black-500/60 p-4">
                    <div class="w-full max-w-xl bg-slate-900 rounded-2xl  border border-slate-700  p-6 text-white">
                        <div class="flex justify-between items-center font-bold mb-4">
                            <strong>Ajouter un match</strong>
                            <button id="fermer"
                                class="text-2xl leading-none text-slate-400 hover:text-white cursor-pointer">
                                &times;</button>
                        </div>
                        <div class="flex flex-col gap-4">
                            <div>
                                <label for="advensaire" class="text-xs font-semibold text-slate-300">Advensaire</label>
                                <input type="text" id="advensaire"
                                    class="w-full mt-1 bg-slate-900 border border-slate-700 p-2 rounded-lg text-white focus:outline-none focus:border-green-500">

                            </div>
                            <div class="flex gap-3">
                                <div class="flex-1">
                                    <label for="date" class="text-xs font-semibold text-slate-300">Date</label>
                                    <input type="text" id="date"
                                        class="w-full mt-1 bg-slate-900 border border-slate-700 p-2 rounded-lg text-white">

                                </div>
                                <div class="flex-1">
                                    <label for="date" class="text-xs font-semibold text-slate-300">Date</label>
                                    <input type="time" id="heure"
                                        class="w-full mt-1 bg-slate-900 border border-slate-700 p-2 rounded-lg text-white">

                                </div>


                            </div>
                            <div >
                                <p class="text-xs font-semibold text-slate-300 "> Lieu du match</p>
                                <div class="flex gap-3 mt-1">
                                    <label class="flex-1 flex items-center gap-2 bg-slate-900 border border-slate-700 p-2 rounded-lg cursor-pointer ">
                                        <input type="radio" name="type" value="Extérieur">Extérieur</label>

                                </div>
                                 </div>
                        </div>
                    <div class="flex justify-end gap-3 mt-6 ">
                        <button id="annuller " class="px-4 py-2 rounded-lg bg-slate-700 text-white text-sm font-semibold cursor-pointer">Annuler</button>
                        <button id="enregistrer" class="px-4 py-2 rounded-lg bg-green-500 text-white text-sm font-semibold cursor-pointer">Enregistrer</button>

                    </div>

                    </div>
                </div>
            </div>
        </div>

        <div class="flex  gap-1 rounded-lg bg-slate-900 p-1 w-full ">

            <div class=" flex  items-center gap-3 rounded-xl border border-slate-700 bg-slate-800 p-4 w-full">
                <div class="grid grid-cols-3 w-100 bg-slate-900 rounded-xl p-1 ">
                    <button data-filter="tous"
                        class="filter rounded-md bg-green-500 px-2 py-1 text-sm font-semibold text-white">Tous</button>
                    <button data-filter="avenir" class="filter rounded-md px-3 py-1 text-sm font-semibold text-white">A
                        venir</button>
                    <button data-filter="joues" class="filter rounded-md px-3 py-1 text-sm font-semibold  text-white">
                        Joues</button>
                </div>
                <input id="recherche" type="search" placeholder="rechercher un advensaire... "
                    class="w-full bg-slate-900 p-1 rounded-xl text-white">
            </div>
        </div>


    </main>
</body>

</html>
